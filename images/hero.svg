<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Interfaces web em vários dispositivos</title>
  <desc id="d">Janela de browser com uma página em construção, um tablet e um telemóvel ao lado e símbolos de código.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1330"/>
      <stop offset="1" stop-color="#2a1f5c"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6cf6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="pontos" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8f9bff" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#pontos)"/>

  <!-- símbolos de código -->
  <g font-family="Consolas, Menlo, monospace" font-weight="700">
    <text x="50" y="230" font-size="64" fill="#ffd166" opacity="0.75">{ }</text>
    <text x="1150" y="130" font-size="72" fill="#5eead4" opacity="0.8">&lt;/&gt;</text>
    <text x="1480" y="200" font-size="56" fill="#ff8fa3" opacity="0.7">#</text>
    <text x="70" y="500" font-size="48" fill="#8f9bff" opacity="0.6">;</text>
  </g>

  <!-- janela de browser -->
  <g>
    <rect x="180" y="90" width="760" height="420" rx="16" fill="#1b2050" stroke="#3b4396" stroke-width="2"/>
    <path d="M180 106 a16 16 0 0 1 16 -16 h728 a16 16 0 0 1 16 16 v24 h-760 z" fill="#232a66"/>
    <circle cx="208" cy="110" r="6" fill="#ff6b6b"/>
    <circle cx="230" cy="110" r="6" fill="#ffd166"/>
    <circle cx="252" cy="110" r="6" fill="#5eead4"/>
    <rect x="300" y="100" width="400" height="20" rx="10" fill="#12163a"/>

    <!-- navegação -->
    <rect x="210" y="150" width="700" height="30" rx="6" fill="#2b3380"/>
    <rect x="226" y="160" width="60" height="10" rx="5" fill="#fff" opacity="0.9"/>
    <rect x="620" y="160" width="50" height="10" rx="5" fill="#fff" opacity="0.5"/>
    <rect x="690" y="160" width="50" height="10" rx="5" fill="#fff" opacity="0.5"/>
    <rect x="760" y="160" width="50" height="10" rx="5" fill="#fff" opacity="0.5"/>

    <!-- bloco principal -->
    <rect x="210" y="200" width="700" height="130" rx="10" fill="url(#hero)"/>
    <rect x="240" y="228" width="260" height="18" rx="9" fill="#fff"/>
    <rect x="240" y="258" width="340" height="10" rx="5" fill="#fff" opacity="0.7"/>
    <rect x="240" y="276" width="290" height="10" rx="5" fill="#fff" opacity="0.7"/>
    <rect x="240" y="296" width="100" height="26" rx="13" fill="#ff7a59"/>

    <!-- cartões -->
    <g fill="#232a66">
      <rect x="210" y="350" width="220" height="130" rx="10"/>
      <rect x="450" y="350" width="220" height="130" rx="10"/>
      <rect x="690" y="350" width="220" height="130" rx="10"/>
    </g>
    <g fill="#3b4396">
      <rect x="226" y="366" width="60" height="44" rx="8"/>
      <rect x="466" y="366" width="60" height="44" rx="8"/>
      <rect x="706" y="366" width="60" height="44" rx="8"/>
    </g>
    <g fill="#8f9bff" opacity="0.6">
      <rect x="226" y="424" width="170" height="9" rx="4.5"/><rect x="226" y="442" width="120" height="9" rx="4.5"/>
      <rect x="466" y="424" width="170" height="9" rx="4.5"/><rect x="466" y="442" width="120" height="9" rx="4.5"/>
      <rect x="706" y="424" width="170" height="9" rx="4.5"/><rect x="706" y="442" width="120" height="9" rx="4.5"/>
    </g>

    <!-- seleção de um elemento -->
    <rect x="444" y="344" width="232" height="142" rx="12" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="6 5"/>
    <g fill="#12163a" stroke="#5eead4" stroke-width="2">
      <rect x="439" y="339" width="10" height="10"/><rect x="671" y="339" width="10" height="10"/>
      <rect x="439" y="481" width="10" height="10"/><rect x="671" y="481" width="10" height="10"/>
    </g>
    <path d="M620 430 l0 40 l11 -10 l8 18 l8 -4 l-8 -18 l15 -1 z" fill="#fff" stroke="#12163a" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- tablet -->
  <g>
    <rect x="1000" y="170" width="250" height="330" rx="22" fill="#1b2050" stroke="#3b4396" stroke-width="2"/>
    <rect x="1016" y="190" width="218" height="26" rx="6" fill="#2b3380"/>
    <rect x="1016" y="228" width="218" height="80" rx="8" fill="url(#hero)"/>
    <rect x="1016" y="322" width="102" height="70" rx="8" fill="#232a66"/>
    <rect x="1132" y="322" width="102" height="70" rx="8" fill="#232a66"/>
    <rect x="1016" y="406" width="102" height="70" rx="8" fill="#232a66"/>
    <rect x="1132" y="406" width="102" height="70" rx="8" fill="#232a66"/>
  </g>

  <!-- telemóvel -->
  <g>
    <rect x="1290" y="250" width="140" height="250" rx="24" fill="#1b2050" stroke="#3b4396" stroke-width="2"/>
    <rect x="1350" y="258" width="20" height="5" rx="2.5" fill="#3b4396"/>
    <rect x="1304" y="276" width="112" height="20" rx="6" fill="#2b3380"/>
    <rect x="1304" y="306" width="112" height="70" rx="8" fill="url(#hero)"/>
    <rect x="1304" y="388" width="112" height="44" rx="8" fill="#232a66"/>
    <rect x="1304" y="442" width="112" height="44" rx="8" fill="#232a66"/>
  </g>
</svg>
